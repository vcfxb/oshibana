[package]
name = "desktop"
edition.workspace = true
version.workspace = true

[features]
prod = []

[dependencies]
anyhow = "1.0.102"
directories = "6.0.0"

# Disabling wgpu and using glow speeds up startup significantly (2 seconds).
# This seems to be due to wgpu taking time to query the OS for gpu adapter data and the host responding too slowly?
# not sure if this is a wgpu issue or a driver issue or maybe just something on my system, but glow should be fine
# for most/all usecases regardless
eframe = { version = "0.34.2", default-features = false, features = [
    "glow",
    "wayland",
    "default_fonts",
    "x11",
    "persistence"
] }

egui = "0.34.1"
egui_extras = { version = "0.34.3", features = ["all_loaders", "http", "file"] }
log = "0.4.29"
log4rs = "1.4.0"
tokio = { version = "1.52.1", features = ["full"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
humansize = "2.1.3"
atomic_float = "1.1.0"
atomic-time = "0.2.1"
mimalloc = "0.1.50"
struson = { version = "0.7.2", features = ["serde"] }
serde_json = "1.0.150"

# Workspace crates
clients.workspace = true
schemas.workspace = true
polars.workspace = true
reqwest.workspace = true
url.workspace = true
serde.workspace = true
chrono.workspace = true
egui_material_icons = "0.6.0"
scopeguard = "1.2.0"
egui_alignments = "0.3.8"
uuid = { version = "1.23.2", features = ["v4"] }
