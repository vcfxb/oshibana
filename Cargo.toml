[workspace]
resolver = "3"
members = [
    "clients",
    "desktop",
    "schemas"
]

## for flamegraph
#[profile.release]
#debug = true

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
schemas = { path = "schemas" }
clients = { path = "clients" }
chrono = { version = "0.4.45", features = ["serde"] }
polars  = { version = "0.54.4", features = [
    "dtype-struct",
    "strings",
    "dtype-i128",
    "dtype-u128",
#    "dtype-array",
#    "dtype-i8",
    "dtype-u8",
    "lazy",
    "parquet"
]}

futures = "0.3.32"
reqwest = { version = "0.13.4", features = ["json", "blocking"] }
url = { version = "2.5.8", features = ["serde"] }
serde = "1.0.228"