[workspace]
resolver = "3"
members = [
    "clients",
    "desktop",
    "schemas"
]

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
schemas = { path = "schemas" }
clients = { path = "clients" }
chrono  = { version = "0.4.41" }
polars  = { version = "0.53.0", features = ["full"] }
